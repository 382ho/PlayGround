<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Muse</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@500;600;700&display=swap');
:root{--ink:#1e1848;--cream:#fffaf3;--pink:#ff8eb4;--gold:#f2ba45}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:#eabebd;color:var(--ink);user-select:none}
.app{height:100%;min-height:560px;display:grid;grid-template-columns:88px minmax(0,1fr) 260px;background:radial-gradient(circle at 48% 42%,#fff 0 20%,#fdf3ec 55%,#efbeb9 100%)}
.rail{background:#2b2456;color:white;padding:22px 12px 14px;display:flex;flex-direction:column;align-items:center;z-index:5}.brand{width:54px;height:54px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;font-family:'Cormorant Garamond';font-size:29px;background:#fff1}.railline{height:1px;width:42px;background:#ffffff38;margin:18px 0}.nav{display:flex;flex-direction:column;gap:12px}.nav button{width:56px;height:56px;border:0;border-radius:18px;color:#bbb5d7;background:transparent;font-size:21px;cursor:pointer}.nav button.active{background:#ff8eb4;color:#fff;box-shadow:0 8px 20px #ff6d9c55}.rail .sound{margin-top:auto;border:0;width:44px;height:44px;border-radius:50%;background:#ffffff12;color:#fff;font-size:16px}
.main{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 20px 16px}.topbar{width:min(700px,100%);height:64px;display:flex;align-items:center;justify-content:space-between}.title{text-align:center}.title h1{font-family:'Cormorant Garamond';font-size:29px;line-height:.9;margin:0}.title p{font-size:10px;letter-spacing:3px;text-transform:uppercase;margin:8px 0 0;color:#9b8da1}.stars{display:flex;gap:5px}.star{width:18px;height:18px;color:#b7aac0}.star.on{color:#f2ad38}.level{font-size:11px;font-weight:700;color:#81758e;letter-spacing:1px}
.stage{position:relative;flex:1;width:min(590px,100%);max-height:650px;display:grid;place-items:center}.portrait{position:absolute;width:min(390px,58vh,76%);height:min(590px,82vh,92%);bottom:0;filter:drop-shadow(0 22px 20px #5f3b6840)}
.decor{position:absolute;pointer-events:none}.arch{width:min(430px,64vh,82%);height:min(620px,88vh,96%);bottom:-6px;border:2px solid #ffffffc9;border-bottom:0;border-radius:220px 220px 0 0;background:linear-gradient(135deg,#ffffff44,#ffffff06);box-shadow:inset 0 0 0 12px #ffffff18}.flower{font-size:45px;opacity:.8}.f1{left:9%;top:30%;transform:rotate(-18deg)}.f2{right:7%;top:39%;transform:rotate(22deg)}.spark{color:#f6b54b;font-size:23px}.s1{left:15%;top:17%}.s2{right:14%;top:20%}.s3{right:10%;top:66%}
.person{position:absolute;inset:5% 10% 0;overflow:hidden}.hair-back{position:absolute;width:69%;height:50%;left:15.5%;top:8%;border-radius:48% 48% 38% 38%;background:#3a1c32;box-shadow:inset 18px 0 38px #170e23,inset -12px -5px 20px #5d3149}.hair-back:after{content:'';position:absolute;width:36%;height:58%;right:-9%;bottom:-20%;border-radius:50%;background:#4a263d}.neck{position:absolute;width:20%;height:19%;left:40%;top:48%;background:linear-gradient(90deg,#b96f52,#e2ad86 48%,#ca805e);border-radius:20px}.face{position:absolute;width:46%;height:38%;left:27%;top:14%;border-radius:48% 48% 48% 48%;background:linear-gradient(100deg,#c77f61 0,#eab18a 40%,#efbf9b 72%,#bd755b 100%);box-shadow:inset 7px -7px 12px #9b604754}.ear{position:absolute;width:11%;height:17%;top:27%;border-radius:50%;background:#d99a78}.ear.l{left:21.5%}.ear.r{right:21.5%}.hair-front{position:absolute;z-index:3;width:54%;height:28%;left:23%;top:7%;border-radius:52% 52% 28% 34%;background:#3a1c32;clip-path:polygon(0 0,100% 0,100% 62%,85% 73%,75% 48%,55% 38%,38% 58%,22% 54%,8% 76%,0 74%)}.hair-front:after{content:'';position:absolute;width:48%;height:75%;right:-20%;top:35%;border-radius:50%;background:#3a1c32}.eye{position:absolute;z-index:4;width:8%;height:4%;top:32%;border-radius:50%;border-bottom:3px solid #352027}.eye.l{left:36%}.eye.r{right:36%}.brow{position:absolute;z-index:4;width:9%;height:3%;top:28%;border-radius:50%;border-top:2px solid #50302f}.brow.l{left:35%;transform:rotate(-5deg)}.brow.r{right:35%;transform:rotate(5deg)}.nose{position:absolute;z-index:4;width:9%;height:11%;left:45.5%;top:31%;border-radius:50%;border-right:2px solid #b9785f}.cheek{position:absolute;z-index:4;width:20%;height:8%;top:39%;border-radius:50%;background:#ef758033}.cheek.l{left:28%}.cheek.r{right:28%}.lip{position:absolute;z-index:4;width:12%;height:5%;left:44%;top:43%;border-radius:50% 50% 55% 55%;background:#a94f62;box-shadow:inset 0 3px #e88d99}
.body{position:absolute;width:74%;height:42%;left:13%;bottom:-5%;border-radius:48% 48% 0 0}.dress1{background:linear-gradient(120deg,#7b62d0,#9a87e8 55%,#6751ba);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.dress2{background:linear-gradient(120deg,#ed759a,#ffb0c4 55%,#e75f86);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.dress3{background:linear-gradient(120deg,#53b7b2,#8edbd3 55%,#318e91);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.dress4{background:linear-gradient(120deg,#d4aa42,#f5d67b 55%,#ba8827);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.side{background:#fffaf5;border-left:1px solid #ead8d5;padding:18px 16px 14px;display:flex;flex-direction:column;z-index:5}.side h2{font-family:'Cormorant Garamond';font-size:23px;text-align:center;margin:4px 0 14px}.tabs{height:44px;display:flex;background:#f1e7e3;border-radius:14px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;border-radius:10px;background:transparent;color:#98899a;font-size:11px;font-weight:700;cursor:pointer}.tabs button.active{background:#fff;color:#e56891;box-shadow:0 4px 10px #a9818040}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;padding:2px}.item{height:83px;border:2px solid transparent;border-radius:16px;background:#f4ece7;display:grid;place-items:center;cursor:pointer;position:relative}.item.selected{border-color:#f47e9f;background:#fff}.swatch{width:54px;height:54px;border-radius:50%;box-shadow:inset -8px -8px 14px #0002,0 5px 10px #7d526a22}.dress-mini{width:50px;height:64px;clip-path:polygon(32% 0,68% 0,78% 25%,100% 100%,0 100%,22% 25%)}.heart-mini{font-size:42px}.item span{position:absolute;bottom:4px;font-size:8px;text-transform:uppercase;letter-spacing:1px;color:#9c8d92}.done{margin-top:auto;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff91b4,#f16d98);color:white;font-weight:700;font-size:13px;box-shadow:0 10px 20px #e56c9855;cursor:pointer}.done:active{transform:translateY(2px)}
.modal{position:absolute;z-index:20;inset:0;background:#34254c80;backdrop-filter:blur(8px);display:none;place-items:center}.modal.show{display:grid}.card{width:min(360px,86%);background:#fffaf5;border-radius:28px;padding:28px;text-align:center;box-shadow:0 30px 70px #3a254b55}.card .badge{width:74px;height:74px;margin:-64px auto 12px;border-radius:50%;display:grid;place-items:center;background:#f6bc48;font-size:38px;border:8px solid #fffaf5}.card h2{font-family:'Cormorant Garamond';font-size:34px;margin:6px}.card p{color:#907e91;font-size:13px}.card button{width:100%;height:50px;border:0;border-radius:15px;background:#30275a;color:#fff;font-weight:700;margin-top:12px}
@media(max-width:760px){.app{grid-template-columns:62px minmax(0,1fr)}.side{position:absolute;right:8px;bottom:8px;width:190px;height:auto;border:0;border-radius:22px;padding:10px;box-shadow:0 12px 30px #56354d33}.side h2{display:none}.grid{max-height:175px}.item{height:61px}.swatch{width:42px;height:42px}.dress-mini{width:40px;height:48px}.tabs{height:38px;margin-bottom:8px}.done{height:44px;margin-top:8px}.rail{padding:12px 5px}.nav button{width:48px;height:48px}.main{padding:10px 8px}.title h1{font-size:24px}.topbar{height:52px}.portrait{width:min(390px,65vw,56vh);height:min(590px,75vh)}.level{display:none}.stage{width:100%}.arch{width:min(430px,75vw,64vh)}}
@media(max-width:500px){.app{grid-template-columns:54px minmax(0,1fr)}.rail .brand{width:42px;height:42px}.nav{gap:6px}.nav button{width:42px;height:42px;border-radius:13px}.side{right:5px;bottom:5px;width:172px}.portrait{width:70vw;height:62vh;left:0}.main{align-items:flex-start}.topbar{width:calc(100vw - 54px)}.stars{display:none}.arch{width:82vw;left:-7px}.f1,.f2{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="rail"><div class="brand">GM</div><div class="railline"></div><nav class="nav"><button class="active" title="Portrait">◆</button><button title="Looks">♧</button><button title="Gallery">▦</button></nav><button class="sound" id="sound">♪</button></aside>
<main class="main"><header class="topbar"><div class="level">LOOK 02</div><div class="title"><h1>Golden Muse</h1><p>Portrait Atelier</p></div><div class="stars"><span class="star on">★</span><span class="star on">★</span><span class="star">★</span></div></header>
<section class="stage"><div class="decor arch"></div><div class="decor flower f1">✿</div><div class="decor flower f2">❀</div><div class="decor spark s1">✦</div><div class="decor spark s2">✦</div><div class="decor spark s3">✦</div>
<div class="portrait"><div class="person"><div class="hair-back"></div><div class="neck"></div><div class="ear l"></div><div class="ear r"></div><div class="face"></div><div class="hair-front"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="cheek l"></div><div class="cheek r"></div><div class="lip"></div><div class="body dress1" id="dress"></div></div></div></section></main>
<aside class="side"><h2>Style her</h2><div class="tabs"><button class="active" data-tab="dresses">Dresses</button><button data-tab="mood">Mood</button></div><div class="grid" id="grid"></div><button class="done" id="done">FINISH LOOK</button></aside>
</div>
<div class="modal" id="modal"><div class="card"><div class="badge">★</div><h2>Golden Muse!</h2><p id="scoreText">A lovely portrait worthy of the salon.</p><button id="again">STYLE ANOTHER LOOK</button></div></div>
<script>
const grid=document.querySelector('#grid'),dress=document.querySelector('#dress'),modal=document.querySelector('#modal');let tab='dresses',choice=0,score=0;
const dresses=[['Violet','dress1'],['Rose','dress2'],['Teal','dress3'],['Honey','dress4']];
function render(){grid.innerHTML='';if(tab==='dresses')dresses.forEach((d,i)=>{const el=document.createElement('div');el.className='item'+(choice===i?' selected':'');el.innerHTML=`<div class="dress-mini ${d[1]}" style="background:${['linear-gradient(120deg,#7960cb,#9e91ed)','linear-gradient(120deg,#ed759a,#ffc1d0)','linear-gradient(120deg,#53b7b2,#9be1d6)','linear-gradient(120deg,#d4aa42,#f8db82)'][i]}"></div><span>${d[0]}</span>`;el.onclick=()=>{choice=i;dress.className='body '+d[1];render();beep(260+i*45)};grid.appendChild(el)})
else [['Dreamy','♥'],['Bold','✦'],['Soft','❀'],['Royal','♛']].forEach((m,i)=>{const el=document.createElement('div');el.className='item'+(choice===i+4?' selected':'');el.innerHTML=`<div class="heart-mini">${m[1]}</div><span>${m[0]}</span>`;el.onclick=()=>{choice=i+4;document.querySelector('.lip').style.background=['#a94f62','#8f2947','#cc5c76','#7e315b'][i];render();beep(300+i*35)};grid.appendChild(el)})}
document.queryAll=document.querySelectorAll.bind(document);
document.queryAll('.tabs button').forEach(b=>b.onclick=()=>{document.queryAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
function beep(f){if(document.querySelector('#sound').textContent==='×')return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
document.querySelector('#sound').onclick=e=>{e.currentTarget.textContent=e.currentTarget.textContent==='♪'?'×':'♪'};
document.querySelector('#done').onclick=()=>{score=choice===0?3:choice<4?2:2;document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on',i<score));document.querySelector('#scoreText').textContent=['A lovely portrait worthy of the salon.','A refined look made for the spotlight.','The judges adored your color story.'][score-1];modal.classList.add('show');beep(440)};
document.querySelector('#again').onclick=()=>{modal.classList.remove('show')};render();
</script>
</body></html>
